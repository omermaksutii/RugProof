name: Rugproof — release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Build MCP servers
        working-directory: mcp
        run: |
          npm install
          npm run build

      - name: Build scripts
        working-directory: scripts
        run: |
          npm install
          npm run build

      - name: Validate plugin.json
        run: node -e 'const p=require("./.claude-plugin/plugin.json"); if(!p.name||!p.version) throw new Error("invalid plugin.json"); console.log("plugin.json ok:", p.name, p.version);'

      - name: Package release
        run: |
          mkdir -p _release
          tar -cz \
            --exclude="**/node_modules" \
            --exclude="**/dist" \
            --exclude=".git" \
            --exclude="lib" \
            --exclude="out" \
            --exclude="_release" \
            -f _release/rugproof-${{ github.ref_name }}-source.tar.gz .

      - name: Bundle dist
        run: |
          tar -cz -f _release/rugproof-${{ github.ref_name }}-dist.tar.gz \
            mcp/*/dist mcp/*/package.json \
            scripts/dist scripts/package.json

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: _release/*.tar.gz
          generate_release_notes: true
