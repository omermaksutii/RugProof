version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "mcp"]
    commit-message:
      prefix: "deps(mcp):"

  - package-ecosystem: "npm"
    directory: "/scripts"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "scripts"]
    commit-message:
      prefix: "deps(scripts):"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps(ci):"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule: { interval: "monthly" }
    labels: ["dependencies", "submodules"]
    commit-message:
      prefix: "deps(lib):"
